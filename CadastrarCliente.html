<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <form id="formulario">
        <h1>Cadastro</h1>
        <label for="nome">Nome Do Cliente</label><br>
        <input type="text" name="nome" id="nome">
        <br>

    

        <label for="cnh">Documento</label><br>
        <input type="number" name="cnh" id="cnh">
        <br>

        <label for="veiculo">Possui Carro</label><br>
        <select name="veiculo" id="veiculo">
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        </select>
        <br>
        <button type="submit">Salvar</button>
        <button><a href="Estacionamento.html">Estacionamento</a></button>
    </form>

    <aside>
        <div class="clientesCadastrados" id="clientesCadastrados">

        </div>
    </aside>
  
    <script type="module" src="script/script.js"></script>


</body>

</html>
