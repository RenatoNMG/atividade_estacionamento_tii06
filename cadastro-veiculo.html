<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>cadastro veiculo</title>
</head>

<body>
    <h1>Cadastro Veiculo</h1>



    <form id="formveiculo">


        <label for="placa">Placa do Veiculo</label><br>
        <input type="text" name="placa" id="placa"><br>


        <label for="modelo">Modelo Do Veiculo</label><br>
        <input type="text" name="modelo" id="modelo"><br>

        <label for="cor">Cor Do Veiculo</label><br>
        <input type="text" name="cor" id="cor"><br>



        <button type="submit">Salvar</button>

    </form>


    <script type="module" src="script/veiculo.js"></script>

</body>

</html>
